name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Vérifier que le code généré correspond aux .proto
        run: |
          python scripts/generate_protos.py
          git diff --exit-code -- protos contract_evolution/generated_v2
      - name: Tests
        run: python -m pytest -q
      - name: Fumée — benchmark court
        run: python main.py --benchmark --iterations 50 --warmup 5 --no-save
